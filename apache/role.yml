kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: 
  name: apache-manager
  namespace: apache
rules:
   - apiGroups: ["", "apps", "batch", "rbac.authorization.k8s.io/v"]
     resources: ["pods", "deployments", "services"]
     verbs: ["get","apply","list","delete", "watch", "create", "patch"]


